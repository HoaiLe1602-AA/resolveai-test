<title>Chợ Gió</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một thanh điều hướng chung. Bên trái là giao diện khách (hộp chat trên trang cửa hàng mẫu),
   bên phải là trang quản trị CSKH (tổng quan, hàng đợi, ticket, kho tài liệu). Trạng thái dùng chung nên
   hội thoại ở bên khách hiện ngay trong hàng đợi bên quản trị. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --surface-2:#eaf0f2; --ink:#13232b; --muted:#587078; --line:#d9e2e6;
  --accent:#0b6e6e; --accent-ink:#ffffff; --accent-soft:#dcf0ef;
  --warn:#9a5b06; --warn-soft:#fcefd6; --bad:#b42318; --bad-soft:#fde8e6; --good:#17794a; --good-soft:#dff3e8;
  --c1:#2f7fd1; --c2:#d1493f; --c3:#d98a1f; --c4:#7a5cc7; --c5:#2a9d8f;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191e; --surface:#15242b; --surface-2:#1c2f37; --ink:#e5eef1; --muted:#92a6ae; --line:#26404a;
  --accent:#4fc3bd; --accent-ink:#06201f; --accent-soft:#143a3c;
  --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#ff8f84; --bad-soft:#401d1a; --good:#6fd6a0; --good-soft:#133626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191e; --surface:#15242b; --surface-2:#1c2f37; --ink:#e5eef1; --muted:#92a6ae; --line:#26404a;
  --accent:#4fc3bd; --accent-ink:#06201f; --accent-soft:#143a3c;
  --warn:#f0b35a; --warn-soft:#3a2c12; --bad:#ff8f84; --bad-soft:#401d1a; --good:#6fd6a0; --good-soft:#133626; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:16px}
nav{display:flex;gap:4px;align-items:center;overflow-x:auto;max-width:100%;padding-bottom:2px}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:500;display:flex;gap:6px;align-items:center}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
nav .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px;white-space:nowrap}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.badge.soft{background:var(--accent);color:var(--accent-ink)}

/* shared pieces */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-moi{background:var(--accent-soft);color:var(--accent)}
.st-xuly{background:var(--warn-soft);color:var(--warn)}
.st-xong{background:var(--good-soft);color:var(--good)}
.st-cho{background:var(--bad-soft);color:var(--bad)}
.h-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.h-row h2{font-size:20px;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
label.f{display:grid;gap:4px;font-weight:500;font-size:13px}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
.note-demo{font-size:12px;color:var(--muted)}

/* customer view */
.cust{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.shop{display:grid;gap:18px}
.shop-hero{padding:28px;display:grid;gap:10px}
.shop-hero small{letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:11px}
.shop-hero h1{font-size:28px;letter-spacing:-.02em}
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.prod{padding:14px;display:grid;gap:4px}
.prod b{font-size:15px}
button.prod{text-align:left;cursor:pointer;color:inherit;font:inherit;align-content:start;background:var(--surface)}
button.prod:hover{border-color:var(--accent)}
button.prod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prod .go{margin-top:6px;font-size:12px;font-weight:600;color:var(--accent)}
.prod .pr{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.hint{padding:14px 16px;font-size:13px}
.hint b{display:block;margin-bottom:4px}
.chat{display:flex;flex-direction:column;height:600px;max-height:calc(100vh - 40px);position:sticky;top:16px;overflow:hidden}
.chat-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.chat-h .t{flex:1;min-width:0}
.chat-h .t b{display:block;line-height:1.2}
.chat-h .t span{font-size:12px;color:var(--muted)}
.banner{padding:7px 14px;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn)}
.banner.staff{background:var(--good-soft);color:var(--good)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{display:flex;flex-direction:column;max-width:86%;gap:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .bub{padding:8px 12px;border-radius:14px;background:var(--surface-2);overflow-wrap:anywhere}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai .bub,.msg.staff .bub{border-bottom-left-radius:4px}
.msg.staff .bub{background:var(--good-soft)}
.msg time{font-size:11px;color:var(--muted)}
.msg .who{font-size:11px;font-weight:600;color:var(--good)}
.src{margin-top:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.tkcard{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;display:grid;gap:2px;font-size:13px}
.tkcard b{font-family:var(--f-mono);font-size:13px}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:99px;text-align:center}
.typing{display:inline-flex;gap:4px;padding:11px 13px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.composer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.composer input{flex:1}

/* admin */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{padding:16px}
.card h3{font-size:15px;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-bottom:6px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;font-size:13px}
.bar .tr{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.split{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--surface-2);margin:8px 0}
.split i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.md{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;align-items:start}
.list{display:grid;gap:0;max-height:620px;overflow-y:auto}
.item{display:grid;gap:3px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item .r2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{padding:16px;display:grid;gap:14px;min-width:0}
.thread{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;max-height:300px;overflow-y:auto;background:var(--bg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notes{display:grid;gap:8px}
.notes div{border-left:3px solid var(--accent);padding:2px 10px;font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (max-width:900px){
  .cust,.two,.md{grid-template-columns:minmax(0,1fr)}
  .chat{position:static;height:560px}
  .shop-hero h1{font-size:23px}
}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">G</span>Chợ Gió</div>
  </header>
  <!-- CUSTOMER -->
  <section id="v-khach-hang">
    <div class="cust">
      <div class="shop">
        <div class="panel shop-hero">
          <small>Chợ Gió</small>
          <h1>Đủ loại hàng cho mọi nhu cầu hằng ngày</h1>
          <p class="muted">Cửa hàng bán nhiều ngành hàng, không có danh mục cố định. Chọn một nhóm hàng bên dưới để chat với trợ lý chuyên về lĩnh vực đó, hoặc nhắn trực tiếp vào hộp chat để được hỗ trợ.</p>
        </div>
        <div class="prods" role="group" aria-label="Chọn ngành hàng để chat với trợ lý chuyên biệt">
          <button type="button" class="panel prod" data-cat="dientu" aria-pressed="false"><b>Điện tử và phụ kiện</b><span class="muted">Tai nghe, sạc dự phòng, loa, robot hút bụi</span><span class="go">Chat với trợ lý Điện tử</span></button>
          <button type="button" class="panel prod" data-cat="thoitrang" aria-pressed="false"><b>Thời trang</b><span class="muted">Áo, quần, giày dép, túi xách</span><span class="go">Chat với trợ lý Thời trang</span></button>
          <button type="button" class="panel prod" data-cat="giadung" aria-pressed="false"><b>Đồ gia dụng</b><span class="muted">Nồi chiên, máy xay, đồ bếp, đồ dùng nhà</span><span class="go">Chat với trợ lý Gia dụng</span></button>
          <button type="button" class="panel prod" data-cat="lamdep" aria-pressed="false"><b>Làm đẹp và sức khỏe</b><span class="muted">Mỹ phẩm, chăm sóc cá nhân, thực phẩm chức năng</span><span class="go">Chat với trợ lý Làm đẹp</span></button>
        </div>
              </div>

      <div class="panel chat" role="region" aria-label="Hộp chat hỗ trợ">
        <div class="chat-h">
          <div class="av" id="chatAv">R</div>
          <div class="t"><b id="chatName">Trợ lý ResolveAI</b><span id="chatSub">Trả lời trong vài giây</span></div>
          <button class="btn sm" id="newChat" type="button">Cuộc mới</button>
        </div>
        <div id="chatBanner"></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <form class="composer" id="chatForm" autocomplete="off">
          <input type="text" id="chatInput" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn">
          <button class="btn primary" type="submit">Gửi</button>
        </form>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fT=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const TYPE_NAMES={tuvan:"Tư vấn",khieunai:"Khiếu nại",doitra:"Đổi trả",baohanh:"Bảo hành",kythuat:"Hỗ trợ kỹ thuật"};
const CATS={
 dientu:{n:"Điện tử và phụ kiện",short:"Điện tử",chips:["Tai nghe chống ồn nào phù hợp đi làm?","Thiết bị không lên nguồn","Bảo hành bao lâu?","Mình muốn đổi trả hàng"]},
 thoitrang:{n:"Thời trang",short:"Thời trang",chips:["Chọn size áo thế nào?","Mình muốn đổi áo sang size lớn hơn","Giặt đồ cotton thế nào?","Giao hàng có tốn phí không?"]},
 giadung:{n:"Đồ gia dụng",short:"Gia dụng",chips:["Nồi chiên nào cho gia đình 3 người?","Máy xay cần công suất bao nhiêu?","Robot hút bụi không lên nguồn","Bảo hành bao lâu?"]},
 lamdep:{n:"Làm đẹp và sức khỏe",short:"Làm đẹp",chips:["Da dầu nên chọn kem dưỡng nào?","Da nhạy cảm cần tránh thành phần gì?","Mỹ phẩm có đổi trả được không?","Giao hàng có tốn phí không?"]}
};
const CHIPS=["Bảo hành bao lâu?","Chọn size áo thế nào?","Mình muốn đổi trả hàng","Thiết bị không lên nguồn","Giao hàng có tốn phí không?","Hôm nay thời tiết thế nào?","Mình quá thất vọng với đơn hàng này"];

let cat=null, conv={id:null,status:"ai",messages:[]}, typing=false, busy=false, err="";
try{const sv=JSON.parse(localStorage.getItem("ra_conv")||"null");if(sv&&sv.id){conv.id=sv.id;cat=sv.cat||null}}catch(e){}
function persist(){try{localStorage.setItem("ra_conv",JSON.stringify(conv.id?{id:conv.id,cat}:null))}catch(e){}}

async function call(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||"Có lỗi xảy ra, vui lòng thử lại.");e.status=r.status;throw e}
  return j;
}
function msgHTML(m){
  if(m.from==="system")return `<div class="sys">${esc(m.text)}</div>`;
  const who=m.from==="customer"?"me":m.from;
  let ex="";
  if(m.src)ex+=`<div class="src">Nguồn: ${esc(m.src)}</div>`;
  if(m.ticketInfo){const t=m.ticketInfo;ex+=`<div class="tkcard"><b>${esc(t.id)}</b><span>${esc(TYPE_NAMES[t.type]||"")} · Đã ghi nhận</span><span class="muted">Mã đơn: ${esc(t.order||"chưa cung cấp")}</span></div>`}
  const lab=m.from==="staff"?`<div class="who">Nhân viên CSKH</div>`:"";
  return `<div class="msg ${who}">${lab}<div class="bub">${esc(m.text).replace(/\n/g,"<br>")}${ex}</div><time>${fT(m.t)}</time></div>`;
}
let lastSig="";
function renderChat(){
  const box=$("#msgs"), msgs=conv.messages, k=cat;
  let h=msgs.length?msgs.map(msgHTML).join(""):`<div class="msg ai"><div class="bub">${k?"Chào bạn, mình là trợ lý chuyên về "+esc(CATS[k].n.toLowerCase())+" của Chợ Gió. Bạn cần hỗ trợ gì hôm nay?":"Chào bạn, mình là trợ lý ResolveAI. Bạn cần hỗ trợ gì hôm nay?"}</div></div>`;
  if(typing)h+=`<div class="msg ai"><div class="bub typing" aria-label="Đang trả lời"><i></i><i></i><i></i></div></div>`;
  if(err)h+=`<div class="sys" style="color:var(--bad)">${esc(err)}</div>`;
  if(conv.status==="closed")h+=`<div class="sys">Hội thoại đã kết thúc. Nhắn tin mới để bắt đầu lại.</div>`;
  box.innerHTML=h;box.scrollTop=box.scrollHeight;
  $("#chatName").textContent=k?"Trợ lý "+CATS[k].short:"Trợ lý ResolveAI";
  $("#chatAv").textContent=k?CATS[k].short[0]:"R";
  const st=conv.status;
  $("#chatBanner").innerHTML=st==="waiting"?`<div class="banner">Đang chờ nhân viên CSKH tiếp nhận</div>`:st==="staff"?`<div class="banner staff">Nhân viên CSKH đang hỗ trợ bạn</div>`:"";
  $("#chatSub").textContent=st==="staff"?"Đang trò chuyện với nhân viên":st==="waiting"?"Đã chuyển nhân viên":(k?"Chuyên về "+CATS[k].n.toLowerCase():"Trả lời trong vài giây");
  $("#chips").innerHTML=msgs.length<2?(CATS[k]?CATS[k].chips:CHIPS).map(x=>`<button type="button">${esc(x)}</button>`).join(""):"";
}
function renderTiles(){
  $$(".prod[data-cat]").forEach(b=>{const on=b.dataset.cat===cat;b.setAttribute("aria-pressed",String(on));b.querySelector(".go").textContent=on?"Đang chat với trợ lý "+CATS[b.dataset.cat].short+" (bấm để bỏ chọn)":"Chat với trợ lý "+CATS[b.dataset.cat].short});
}
function resetConv(){conv={id:null,status:"ai",messages:[]};err="";typing=false;persist()}
function selectCat(k){
  cat=(cat===k)?null:k;resetConv();renderTiles();renderChat();
  const ch=$(".chat");if(ch&&ch.scrollIntoView)ch.scrollIntoView({block:"nearest"});
  $("#chatInput").focus({preventScroll:true});
}
async function send(text){
  text=text.trim();if(!text||busy)return;
  busy=true;err="";
  if(conv.status==="closed")resetConv();
  const optimistic=conv.messages.concat([{from:"customer",text,t:Date.now()}]);
  const prev=conv;conv=Object.assign({},conv,{messages:optimistic});
  const wait=conv.status==="ai";
  typing=wait;renderChat();
  const t0=Date.now();
  try{
    const r=await call("POST","/api/chat/message",{id:prev.id,cat,text});
    if(wait&&Date.now()-t0<600)await new Promise(f=>setTimeout(f,600-(Date.now()-t0)));
    conv={id:r.id,status:r.status,messages:r.messages};persist();
  }catch(e){conv=prev;err=e.message}
  typing=false;busy=false;renderChat();
}
async function poll(){
  if(!conv.id||busy||document.hidden)return;
  try{
    const r=await call("GET","/api/chat/"+conv.id);
    const sig=r.status+"|"+r.messages.length;
    if(sig!==conv.status+"|"+conv.messages.length){conv={id:r.id,status:r.status,messages:r.messages};renderChat()}
  }catch(e){if(e.status===404){resetConv();renderChat()}}
}
$("#chatForm").addEventListener("submit",e=>{e.preventDefault();const i=$("#chatInput");const v=i.value;i.value="";send(v);i.focus()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b)send(b.textContent)});
$("#newChat").addEventListener("click",()=>{resetConv();renderChat()});
document.addEventListener("click",e=>{const ct=e.target.closest(".prod[data-cat]");if(ct)selectCat(ct.dataset.cat)});
renderTiles();renderChat();
if(conv.id)poll().then(()=>{if(conv.id&&!conv.messages.length){resetConv();renderChat()}});
setInterval(poll,2500);
})();
</script>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý chính sách - ResolveAI</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #5d6875;
    --line: #d8dde4; --accent: #1f6feb; --accent-text: #ffffff; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --panel: #1c2128; --text: #e6e9ed; --muted: #9aa4b0;
            --line: #2f3742; --accent: #4c8dff; --accent-text: #0b1220; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
                    background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 260px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
       padding: 8px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li button.link { border: 0; background: none; padding: 0; text-align: left; color: var(--accent); }
  li small { color: var(--muted); display: block; }
  #msg { margin-top: 12px; min-height: 1.4em; }
  #msg.err { color: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Quản lý chính sách</h1>
  <p class="sub">Thêm, sửa hoặc xóa chính sách mà chatbot dùng để trả lời khách.</p>

  <section style="margin-bottom:16px">
    <label for="key" style="margin-top:0">Khóa quản trị (bỏ trống nếu server đang ở chế độ mở)</label>
    <input id="key" type="password" autocomplete="off" placeholder="POLICY_ADMIN_KEY trong .env">
    <div class="row"><button id="load" class="primary" type="button">Tải danh sách chính sách</button></div>
  </section>

  <div class="grid">
    <section>
      <h2>Chính sách hiện có</h2>
      <ul id="list"><li><span class="hint">Bấm tải danh sách để bắt đầu.</span></li></ul>
    </section>

    <section>
      <h2 id="formTitle">Thêm chính sách mới</h2>
      <label for="title">Tiêu đề</label>
      <input id="title" type="text" placeholder="Ví dụ: Chính sách đổi size">
      <label for="slug">Tên file (tùy chọn)</label>
      <input id="slug" type="text" placeholder="doi-size (để trống sẽ tự tạo từ tiêu đề)">
      <p class="hint">Trùng tên file sẽ ghi đè chính sách cũ.</p>
      <label for="content">Nội dung</label>
      <textarea id="content" placeholder="Viết nội dung chính sách. Có thể dùng gạch đầu dòng bằng dấu -"></textarea>
      <div class="row">
        <button id="save" class="primary" type="button">Lưu chính sách</button>
        <button id="reset" type="button">Soạn mới</button>
      </div>
      <div id="msg" role="status"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API = "/api/admin/policies";

function say(text, isErr) { const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : ""; }
function headers() { return { "Content-Type": "application/json", "X-Admin-Key": $("key").value }; }

async function call(path, opts) {
  const res = await fetch(API + path, Object.assign({ headers: headers() }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("Lỗi " + res.status));
  return data;
}

async function loadList() {
  const ul = $("list");
  try {
    const items = await call("");
    ul.textContent = "";
    if (!items.length) { ul.innerHTML = '<li><span class="hint">Chưa có chính sách nào.</span></li>'; return; }
    for (const p of items) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      const open = document.createElement("button");
      open.className = "link"; open.type = "button"; open.textContent = p.title;
      open.onclick = () => edit(p.slug);
      const small = document.createElement("small"); small.textContent = p.slug + ".md";
      left.append(open, small);
      const del = document.createElement("button");
      del.className = "danger"; del.type = "button"; del.textContent = "Xóa";
      del.onclick = () => remove(p.slug, p.title);
      li.append(left, del);
      ul.append(li);
    }
    say("");
  } catch (e) { say(e.message, true); }
}

async function edit(slug) {
  try {
    const p = await call("/" + encodeURIComponent(slug));
    $("title").value = p.title; $("slug").value = p.slug; $("content").value = p.content;
    $("formTitle").textContent = "Sửa chính sách: " + p.title;
    say("");
  } catch (e) { say(e.message, true); }
}

async function remove(slug, title) {
  if (!confirm("Xóa chính sách \"" + title + "\"?")) return;
  try {
    const r = await call("/" + encodeURIComponent(slug), { method: "DELETE" });
    say(r.reloaded ? "Đã xóa." : "Đã xóa. Khởi động lại server để chatbot cập nhật.");
    loadList();
  } catch (e) { say(e.message, true); }
}

async function save() {
  try {
    const body = { title: $("title").value, content: $("content").value, slug: $("slug").value || null };
    const r = await call("", { method: "POST", body: JSON.stringify(body) });
    say(r.reloaded ? "Đã lưu và nạp lại. Chatbot dùng được ngay."
                   : "Đã lưu file " + r.slug + ".md. Khởi động lại server để chatbot cập nhật.");
    loadList();
  } catch (e) { say(e.message, true); }
}

function reset() {
  $("title").value = ""; $("slug").value = ""; $("content").value = "";
  $("formTitle").textContent = "Thêm chính sách mới"; say("");
}

$("load").onclick = loadList;
$("save").onclick = save;
$("reset").onclick = reset;
</script>
</body>
</html>
